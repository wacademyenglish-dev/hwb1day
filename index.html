<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOLFLIX: Area 51 Assessment (B1)</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-image: 
                linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #mobile-container {
            width: 100%;
            max-width: 450px;
            height: 100dvh;
            max-height: 900px;
            background-color: #0a0a0a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.1);
            border-top: 4px solid #22c55e;
        }

        @media (min-width: 480px) {
            #mobile-container {
                height: 90vh;
                border-radius: 0.5rem;
                border: 2px solid #166534;
            }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background-color: #0a0a0a;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }
        .screen.active { transform: translateX(0); z-index: 20; }
        .screen.previous { transform: translateX(-100%); z-index: 10; }

        .option-btn {
            background-color: #111111;
            border: 1px solid #166534;
            color: #e2e8f0;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.2s ease;
            position: relative;
            text-align: left;
            padding: 1.25rem;
            border-radius: 2px;
            width: 100%;
            font-size: 1rem;
        }
        .option-btn:hover {
            border-color: #22c55e;
            background-color: rgba(34, 197, 94, 0.05);
        }
        .option-btn.selected {
            border-color: #22c55e;
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            box-shadow: inset 0 0 15px rgba(34, 197, 94, 0.3);
        }
        .option-btn.correct { border-color: #22c55e; color: #22c55e; background-color: rgba(34,197,94,0.1); }
        .option-btn.wrong { border-color: #ef4444; color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }

        .tech-btn {
            background: transparent;
            color: #22c55e;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            width: 100%;
            padding: 1.25rem;
            border-radius: 2px;
            border: 1px solid #22c55e;
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.2);
        }
        .tech-btn:hover:not(:disabled) {
            background: #22c55e;
            color: #000;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .tech-btn:disabled {
            border-color: #334155;
            color: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="mobile-container">
        <!-- STATUS BAR -->
        <div class="h-8 bg-black text-[#22c55e] flex justify-between items-center px-4 text-[10px] font-bold z-50 shrink-0 font-['Share_Tech_Mono'] border-b border-[#166534]">
            <span>FBI SECURE NET</span>
            <div class="flex gap-2 items-center"><span>DECRYPTING</span><span class="animate-pulse">_</span></div>
        </div>

        <!-- SCREEN 1: LOGIN -->
        <div id="screen-login" class="screen active flex items-center justify-center p-8 text-center">
            <div class="z-10 w-full flex flex-col items-center bg-[#111] p-8 border border-[#166534] shadow-[0_0_30px_rgba(34,197,94,0.1)]">
                <span class="text-6xl mb-4 opacity-80">📁</span>
                <h2 class="font-['Share_Tech_Mono'] text-xs tracking-[0.2em] text-[#22c55e] mb-2 uppercase font-bold">Clearance Level B1</h2>
                <h1 class="font-['Share_Tech_Mono'] text-3xl font-black tracking-widest mb-6 text-white uppercase leading-tight">Agent<br>Assessment</h1>
                <p class="text-sm text-gray-400 mb-10 leading-relaxed font-medium bg-black p-4 border border-[#166534]">
                    "Analyze the evidence. Prove you understand the Present Modals of Speculation to solve the mysteries."
                </p>
                <button onclick="startQuiz()" class="tech-btn">ACCESS FILES</button>
            </div>
        </div>

        <!-- SCREEN 2: QUIZ -->
        <div id="screen-quiz" class="screen flex flex-col">
            <header class="bg-black border-b border-[#166534] p-4 shrink-0 flex items-center justify-between z-20 shadow-md">
                <div class="flex items-center gap-3">
                    <span class="text-[#22c55e] text-lg">📡</span>
                    <span class="font-['Share_Tech_Mono'] font-bold uppercase tracking-widest text-xs text-gray-400" id="q-category">Grammar</span>
                </div>
                <span class="font-['Share_Tech_Mono'] font-black text-xs text-black bg-[#22c55e] px-3 py-1" id="q-counter">1/15</span>
            </header>

            <div class="w-full h-1 bg-black shrink-0"><div id="progress-bar" class="h-full bg-[#22c55e] shadow-[0_0_10px_#22c55e] transition-all duration-300" style="width: 0%;"></div></div>

            <div class="flex-1 overflow-y-auto no-scrollbar p-6 flex flex-col relative bg-[#0a0a0a]">
                <div class="bg-[#111] p-6 border border-[#166534] mb-8 border-l-4 border-l-[#22c55e]">
                    <h2 id="q-text" class="text-lg font-bold text-white leading-relaxed font-['Share_Tech_Mono']">Question goes here?</h2>
                </div>
                <div id="options-container" class="flex flex-col gap-4 mb-8"></div>
                <div class="flex-1"></div>
                <div id="feedback-area" class="hidden mb-6 p-4 text-sm font-bold border font-['Share_Tech_Mono'] tracking-widest uppercase"></div>
            </div>

            <div class="p-4 bg-black border-t border-[#166534] shrink-0">
                <button id="btn-next" onclick="handleNext()" disabled class="tech-btn py-4">CONFIRM DATA</button>
            </div>
        </div>

        <!-- SCREEN 3: RESULTS -->
        <div id="screen-results" class="screen flex flex-col relative overflow-hidden bg-[#0a0a0a]">
            <header class="bg-black p-4 shrink-0 text-center border-b border-[#166534] z-10">
                <span class="font-['Share_Tech_Mono'] font-bold uppercase tracking-widest text-xs text-gray-500">ANALYSIS COMPLETE</span>
            </header>

            <div class="flex-1 flex flex-col items-center justify-center p-8 text-center z-10 relative">
                <div id="result-icon" class="text-7xl mb-6 relative z-10 drop-shadow-[0_0_20px_#22c55e]">👽</div>
                <h1 id="result-title" class="text-3xl font-['Share_Tech_Mono'] font-black text-white uppercase tracking-widest mb-2 relative z-10">Title</h1>
                <p id="result-subtitle" class="text-sm font-bold text-gray-400 mb-8 uppercase tracking-widest relative z-10 font-['Share_Tech_Mono']">
                    Score: <span id="final-score" class="text-[#22c55e] text-lg font-black">15</span> / 15
                </p>
                <div class="w-full bg-[#111] p-6 border border-[#166534] shadow-[0_0_30px_rgba(34,197,94,0.1)] mb-10 relative z-10 border-t-2 border-t-[#22c55e]">
                    <p id="result-msg" class="text-base text-gray-300 leading-relaxed font-medium">"Message goes here."</p>
                </div>
                <button onclick="restartApp()" class="w-full tech-btn text-sm py-4 relative z-10">REBOOT SYSTEM</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // CATEGORY 1: VOCABULARY
            { category: "Vocabulary", question: "What does 'UFO' mean?", options: ["Underground Foreign Object", "Unidentified Flying Object", "Universal Force Organization"], correctIndex: 1, explanation: "UFO is an object in the sky that we cannot identify." },
            { category: "Vocabulary", question: "A video or story that is NOT real, made to trick people is a...", options: ["Secret", "Fake / Hoax", "Invasion"], correctIndex: 1, explanation: "A fake (or hoax) is made to deceive people." },
            { category: "Vocabulary", question: "If the government hides information from the public, they are keeping a...", options: ["Fake", "UFO", "Secret"], correctIndex: 2, explanation: "A secret is something hidden." },
            { category: "Vocabulary", question: "When an army or aliens enter a place to take control, it is an...", options: ["Invasion", "Explosion", "Abduction"], correctIndex: 0, explanation: "An invasion is an attack to take control of an area." },
            
            // CATEGORY 2: PRESENT MODALS (MUST BE)
            { category: "Grammar: Speculation", question: "If you are 90% SURE that something is true, you use...", options: ["Might be", "Can't be", "Must be"], correctIndex: 2, explanation: "We use 'Must be' for strong positive deductions." },
            { category: "Grammar: Speculation", question: "Complete: 'That ship is huge and has lasers. It ________ an alien ship.'", options: ["must be", "might be", "can't be"], correctIndex: 0, explanation: "Because of the evidence (huge, lasers), we are almost certain." },
            { category: "Grammar: Speculation", question: "Choose the correct deduction: 'The man is bleeding and running away. He...'", options: ["must be happy.", "must be in danger.", "can't be in danger."], correctIndex: 1, explanation: "It is the only logical conclusion." },
            
            // CATEGORY 3: PRESENT MODALS (CAN'T BE)
            { category: "Grammar: Speculation", question: "If you are 90% SURE that something is IMPOSSIBLE, you use...", options: ["Mustn't be", "Can't be", "Shouldn't be"], correctIndex: 1, explanation: "We use 'Can't be' to say something is logically impossible." },
            { category: "Grammar: Speculation", question: "Complete: 'The object is 70 meters long and hovering. It ________ a bird.'", options: ["can't be", "might be", "must be"], correctIndex: 0, explanation: "Birds are not 70 meters long. It's impossible." },
            { category: "Grammar: Speculation", question: "Complete: 'She ________ the alien. She is blind!'", options: ["must be", "might be", "can't be"], correctIndex: 2, explanation: "It is logically impossible because she cannot see." },
            
            // CATEGORY 4: PRESENT MODALS (MIGHT/COULD BE)
            { category: "Grammar: Speculation", question: "If you are only 50% sure (it's just a theory or possibility), you use...", options: ["Can't be", "Might be / Could be", "Must be"], correctIndex: 1, explanation: "We use 'Might be' or 'Could be' for possibilities." },
            { category: "Grammar: Speculation", question: "Complete: 'I see a light in the dark forest. I don't know... it ________ a drone.'", options: ["must be", "might be", "can't be"], correctIndex: 1, explanation: "You are not sure, it's just a guess." },
            { category: "Grammar: Speculation", question: "Which sentence shows a THEORY (not certainty)?", options: ["The object in the sky could be a military plane.", "The object in the sky must be a military plane.", "The object in the sky can't be a military plane."], correctIndex: 0, explanation: "'Could be' shows it is just one possible theory." },
            
            // CATEGORY 5: CONTEXT
            { category: "Context Analysis", question: "In the trailer for 'Disclosure Day', what causes people to panic?", options: ["The sun disappears.", "They see giant spaceships in the sky.", "A virus spreads."], correctIndex: 1, explanation: "The invasion of the ships causes society to panic." },
            { category: "Context Analysis", question: "In the 2026 Campo Largo case, what did the man hear?", options: ["Aliens speaking English.", "A loud, mechanical growling sound.", "A beautiful song."], correctIndex: 1, explanation: "He reported a terrifying mechanical growling sound from the UFO." }
        ];

        let currentQuestionIndex = 0; let score = 0; let hasAnswered = false; let selectedIdx = null;

        function startQuiz() { currentQuestionIndex = 0; score = 0; switchScreen('screen-login', 'screen-quiz'); loadQuestion(); }

        function switchScreen(oldId, newId) {
            const oldScreen = document.getElementById(oldId);
            const newScreen = document.getElementById(newId);
            if(oldScreen) oldScreen.classList.replace('active', 'previous');
            if(newScreen) { newScreen.classList.remove('previous'); newScreen.classList.add('active'); }
        }

        function loadQuestion() {
            hasAnswered = false; selectedIdx = null; const q = questions[currentQuestionIndex];
            document.getElementById('q-counter').innerText = `${currentQuestionIndex + 1}/15`;
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('progress-bar').style.width = `${(currentQuestionIndex / 15) * 100}%`;
            
            const container = document.getElementById('options-container'); container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn); container.appendChild(btn);
            });

            const nextBtn = document.getElementById('btn-next');
            if(nextBtn) { nextBtn.disabled = true; nextBtn.innerText = "CONFIRM DATA"; }
            const fb = document.getElementById('feedback-area');
            if(fb) fb.classList.add('hidden');
        }

        function selectOption(idx, btn) {
            if(hasAnswered) return; selectedIdx = idx;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected'); document.getElementById('btn-next').disabled = false;
        }

        function handleNext() {
            if(!hasAnswered) checkAnswer();
            else { currentQuestionIndex++; if(currentQuestionIndex < 15) loadQuestion(); else finishQuiz(); }
        }

        function checkAnswer() {
            hasAnswered = true; const q = questions[currentQuestionIndex];
            const btns = document.querySelectorAll('.option-btn'); const fb = document.getElementById('feedback-area');
            if(selectedIdx === q.correctIndex) {
                score++; btns[selectedIdx].classList.add('correct');
                fb.className = "mb-6 p-4 text-sm font-bold border border-[#22c55e] text-[#22c55e] bg-[#22c55e]/10 rounded font-['Share_Tech_Mono'] tracking-widest uppercase";
                fb.innerHTML = "> VALIDATED: " + q.explanation;
            } else {
                btns[selectedIdx].classList.add('wrong'); btns[q.correctIndex].classList.add('correct');
                fb.className = "mb-6 p-4 text-sm font-bold border border-red-500 text-red-500 bg-red-500/10 rounded font-['Share_Tech_Mono'] tracking-widest uppercase";
                fb.innerHTML = "> ERROR: " + q.explanation;
            }
            fb.classList.remove('hidden');
            document.getElementById('btn-next').innerText = currentQuestionIndex === 14 ? "ANALYZE RESULTS" : "NEXT FILE";
        }

        function finishQuiz() {
            switchScreen('screen-quiz', 'screen-results');
            document.getElementById('final-score').innerText = score;
            const titleEl = document.getElementById('result-title'); const iconEl = document.getElementById('result-icon'); const msgEl = document.getElementById('result-msg');
            
            if(score >= 13) {
                titleEl.innerText = "Special Agent"; iconEl.innerText = "🛸";
                msgEl.innerHTML = "Perfect analysis. Your understanding of Present Modals of Speculation is flawless. You are ready to handle the truth.";
            } else if(score >= 8) {
                titleEl.innerText = "Field Researcher"; iconEl.innerText = "📡"; titleEl.classList.add('text-yellow-500');
                msgEl.innerHTML = "Good work. You know the basics, but review the difference between 'Can't be' and 'Must be' before your next mission.";
            } else {
                titleEl.innerText = "Memory Wiped"; iconEl.innerText = "🧠"; titleEl.classList.add('text-red-500');
                msgEl.innerHTML = "You failed to connect the evidence. The Men in Black have wiped your memory. Try again.";
            }
        }
        function restartApp() { switchScreen('screen-results', 'screen-login'); }
    </script>
</body>
</html>
